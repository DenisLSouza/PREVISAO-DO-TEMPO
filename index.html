<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="scripts.js"></script>
    <title>Previsão do tempo</title>
</head>
<body>
    <div class="caixa-maior">
        <input class="input-cidade"placeholder="Digite o nome da cidade" id="cidade" type="text">
        <button class="botao-busca" onclick="cliqueiNoBotao()">
            <img class="img-busca"alt="busca" src="https://www.svgrepo.com/show/488200/find.svg">
        </button>
    <div class="caixa-media">
        <h2 class="cidade">Tempo em São Paulo</h2>

        <p class="temp">21ºC</p>
        <div class="caixa-menor">
            <img class="img-previsão"alt="icone-info-tempo" src="Imagem/Nuvem.png"> 
            <p class="texto-previsao">Nublado</p>
        </div>
        <p class="umidade">Umidade: 76%</p>
        <p>Vento: 10km/h</p>
        <p>Pressão: 1013hPa</p>
        <p>Visibilidade: 10km</p>
    </div>
    </div>
    
</body>
<footer id="rodape">
    
    <i class="fa fa-copyright" aria-hidden="true"></i>
</footer>
</html>
